<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Jianqing's FlyBobotCar</title>
<style>:root{--bg:#0b1119;--panel:#141f2d;--line:#2b3b50;--text:#edf4fb;--muted:#91a3b8;--cyan:#53d4ff;--yellow:#ffd15c;--green:#6eeba0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1b3550,#0b1119 56%);color:var(--text);font:14px system-ui}.wrap{width:min(1180px,95vw);margin:24px auto}.head{display:flex;justify-content:space-between;align-items:end}.head h1{margin:0 0 4px;font-size:27px}.muted{color:var(--muted)}.live{color:var(--green);font-weight:700}.panel{background:#141f2ddd;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px;box-shadow:0 18px 50px #0005}.grid{display:grid;grid-template-columns:1.38fr .78fr;gap:18px}.card{background:#0e1722;border:1px solid #243448;border-radius:12px;padding:13px}.card h2{font-size:15px;margin:0 0 10px}.scene{width:100%;height:auto;display:block;border-radius:8px;background:#202b39;cursor:grab}.vision{width:100%;image-rendering:pixelated;background:#03070b;border-radius:8px}.eyes{display:flex;justify-content:space-around;color:var(--muted);font-size:12px;margin-top:5px}.flow{text-align:center;color:var(--cyan);font-size:18px;padding:13px 0 8px}.action{border-left:4px solid var(--yellow);background:#211e13;padding:10px 12px;font-size:17px;font-weight:650;color:var(--yellow);border-radius:5px}.reaction{border-left:4px solid var(--green);background:#10241b;padding:9px 12px;margin-top:9px;color:var(--green);border-radius:5px}.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.meter{background:#101923;padding:9px;border-radius:8px}.meterhead{display:flex;justify-content:space-between}.track{height:10px;border-radius:8px;background:#263445;margin-top:7px;overflow:hidden}.fill{height:100%;background:var(--cyan);transition:width .2s}.fill.turn{background:var(--yellow)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}.stat{background:#101923;padding:11px;border-radius:9px}.label{font-size:11px;color:var(--muted)}.value{font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums}button{border:0;border-radius:7px;padding:9px 14px;background:#267fc5;color:white;margin:14px 8px 0 0;cursor:pointer}.hint{margin-top:8px;font-size:12px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><div class="wrap"><div class="head"><div><h1>🪰 Jianqing's FlyBobotCar</h1><div class="muted">MaleCNS 自主探索真实 3D 房间</div></div><div class="live">● LIVE</div></div><div class="panel"><div class="grid"><div class="card"><h2>🏠 3D Room / 小车反应</h2><canvas id="scene" class="scene" width="900" height="560"></canvas><div class="reaction" id="reaction">等待小车反应…</div><div class="muted" id="pose">—</div><div class="hint">拖动旋转 · 滚轮缩放 · 右键平移 · 房间墙壁和家具具有物理碰撞</div></div><div class="card"><h2>👁️ Fly vision / 果蝇看到的房间</h2><canvas id="vision" class="vision" width="256" height="128"></canvas><div class="eyes"><span>← 左眼</span><span>右眼 →</span></div><div class="flow">房间图像 → 果蝇脑 → 小车</div><div class="action" id="action">动作：—</div><div class="muted" id="reflex" style="padding:9px 2px 0">视觉威胁：左 0 · 右 0</div><div class="meters"><div class="meter"><div class="meterhead"><span>油门</span><b id="tv">0</b></div><div class="track"><div class="fill" id="throttle"></div></div></div><div class="meter"><div class="meterhead"><span>转向</span><b id="sv">0</b></div><div class="track"><div class="fill turn" id="steering"></div></div></div></div><p class="muted">没有道路、导航目标或自动纠正。小车只根据果蝇神经活动在房间内自由移动。</p></div></div><div class="stats"><div class="stat"><div class="label">神经元</div><div class="value" id="neurons">—</div></div><div class="stat"><div class="label">本步脉冲</div><div class="value" id="spikes">—</div></div><div class="stat"><div class="label">行驶距离</div><div class="value" id="distance">—</div></div><div class="stat"><div class="label">碰撞次数</div><div class="value" id="collisions">—</div></div><div class="stat"><div class="label">看到的物体</div><div class="value" id="visible">—</div></div></div><button onclick="post('/reset')">重置小车</button><button onclick="post('/pause')">暂停 / 继续</button><button onclick="post('/avoidance')">开关视觉避障反射</button><span class="muted" id="status">加载 3D 房间…</span></div></div></div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';
const $=id=>document.getElementById(id);let state={x:0,y:0,heading:0},car,scene,cam,renderer,controls,hasState=false;
const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.78});const box=(w,h,d,c)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(c));
function addFurniture(o){let g=new THREE.Group(),c=(o.color[0]<<16)|(o.color[1]<<8)|o.color[2];if(o.kind==='sofa'||o.kind==='armchair'){let seat=box(o.w,.45,o.d,c);seat.position.y=.48;g.add(seat);let back=box(o.w,o.h*.75,.35,c);back.position.set(0,o.h*.6,o.d/2-.18);g.add(back);for(let side of [-1,1]){let arm=box(.3,.7,o.d,c);arm.position.set(side*(o.w/2-.15),.65,0);g.add(arm)}}else if(o.kind.includes('table')){let top=box(o.w,.18,o.d,c);top.position.y=o.h;g.add(top);for(let sx of [-1,1])for(let sz of [-1,1]){let leg=box(.16,o.h,.16,0x55402e);leg.position.set(sx*(o.w/2-.25),o.h/2,sz*(o.d/2-.25));g.add(leg)}}else if(o.kind==='bookshelf'){let body=box(o.w,o.h,o.d,c);body.position.y=o.h/2;g.add(body);for(let y=.5;y<o.h;y+=.65){let shelf=box(o.w+.08,.08,o.d+.08,0xe0b77b);shelf.position.y=y;g.add(shelf)}}else{let pot=new THREE.Mesh(new THREE.CylinderGeometry(.55,.42,.7,16),material(0x9a5837));pot.position.y=.35;g.add(pot);let stem=box(.12,1.5,.12,0x376d3d);stem.position.y=1.3;g.add(stem);let leaves=new THREE.Mesh(new THREE.SphereGeometry(.8,16,12),material(0x2f9652));leaves.position.y=2;g.add(leaves)}g.position.set(o.x,0,o.y);g.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true}});scene.add(g)}
async function setup3D(){let canvas=$('scene');scene=new THREE.Scene();scene.background=new THREE.Color(0x182231);cam=new THREE.PerspectiveCamera(48,canvas.width/canvas.height,.1,100);renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;controls=new OrbitControls(cam,canvas);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;controls.minDistance=4;controls.maxDistance=28;scene.add(new THREE.HemisphereLight(0xe6f1ff,0x463b32,2.1));let light=new THREE.DirectionalLight(0xfff1d0,3);light.position.set(-8,13,6);light.castShadow=true;scene.add(light);let floor=box(29,.25,29,0x70685f);floor.position.y=-.14;floor.receiveShadow=true;scene.add(floor);let grid=new THREE.GridHelper(29,29,0x96918b,0x7c746c);grid.position.y=.01;scene.add(grid);let wallMat=material(0x8995a5);for(let [w,h,d,x,y,z] of [[30,7,.3,0,3.5,-15],[30,7,.3,0,3.5,15],[.3,7,30,-15,3.5,0],[.3,7,30,15,3.5,0]]){let wall=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wallMat);wall.position.set(x,y,z);wall.receiveShadow=true;scene.add(wall)}let objects=await(await fetch('/objects')).json();objects.forEach(addFurniture);let lc=document.createElement('canvas');lc.width=1024;lc.height=256;let x=lc.getContext('2d');x.fillStyle='#10243c';x.fillRect(0,0,1024,256);x.fillStyle='white';x.font='bold 61px system-ui';x.textAlign='center';x.fillText("Jianqing's",512,105);x.fillStyle='#61d6ff';x.font='bold 73px system-ui';x.fillText('FlyBobotCar',512,195);let sign=new THREE.Mesh(new THREE.PlaneGeometry(10,2.5),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(lc)}));sign.position.set(0,4.6,-14.8);scene.add(sign);car=new THREE.Group();let body=box(1.8,.65,3,0xf1b92f);body.position.y=.65;car.add(body);let cabin=box(1.35,.58,1.35,0x1c526c);cabin.position.set(0,1.16,-.2);car.add(cabin);for(let wx of [-.92,.92])for(let wz of [-.95,.95]){let wheel=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.18,16),material(0x111820));wheel.rotation.z=Math.PI/2;wheel.position.set(wx,.38,wz);car.add(wheel)}car.traverse(n=>{if(n.isMesh)n.castShadow=true});scene.add(car);function animate(){requestAnimationFrame(animate);if(car){car.position.set(state.x,0,state.y);car.rotation.y=-state.heading-Math.PI/2}controls.update();renderer.render(scene,cam)}animate()}
async function post(url){await fetch(url,{method:'POST'})}window.post=post;
async function drawVision(){try{let a=new Uint8ClampedArray(await(await fetch('/vision',{cache:'no-store'})).arrayBuffer()),c=$('vision').getContext('2d'),im=c.createImageData(256,128);for(let i=0,j=0;i<a.length;i+=3,j+=4){im.data[j]=a[i];im.data[j+1]=a[i+1];im.data[j+2]=a[i+2];im.data[j+3]=255}c.putImageData(im,0,0)}catch(e){}}
async function update(){try{let s=await(await fetch('/state',{cache:'no-store'})).json();if(!hasState){cam.position.set(s.x+6,7,s.y+5);controls.target.set(s.x,0,s.y);hasState=true}else{let dx=s.x-state.x,dz=s.y-state.y;cam.position.x+=dx;cam.position.z+=dz;controls.target.x+=dx;controls.target.z+=dz}state=s;let move=s.throttle>8?'前进':'停止',turn=s.steering>8?'右转':s.steering<-8?'左转':'直行';$('action').textContent=`应用动作：${move} · ${turn}｜原始脑输出 ${s.raw_throttle}/${s.raw_steering}`;$('reflex').textContent=`视觉威胁：左 ${s.left_threat} · 右 ${s.right_threat}｜控制源：${s.control_source}`;$('reaction').textContent=s.last_contact==='none'?(s.assist?'👁️ 检测到逼近物体，正在执行视觉避障反射':'✅ MaleCNS 正在房间内自主驾驶'):`🛑 碰到：${s.last_contact}`;$('pose').textContent=`位置 (${s.x}, ${s.y}) · 速度 ${s.speed} · 撞墙 ${s.wall_collisions}`;[['neurons',s.neurons.toLocaleString()],['spikes',s.spikes],['distance',s.distance],['collisions',s.collisions],['visible',`${s.visible_objects}/${s.object_count}`]].forEach(([id,v])=>$(id).textContent=v);$('tv').textContent=s.throttle;$('sv').textContent=s.steering;$('throttle').style.width=Math.abs(s.throttle)/70*100+'%';$('steering').style.width=Math.abs(s.steering)/70*100+'%';$('status').textContent=`${s.paused?'已暂停':'运行中'} · ${s.avoidance_enabled?'FLY VISUAL REFLEX ON':'RAW MALECNS'} · ROOM`;}catch(e){$('status').textContent='后端连接断开'}}setup3D();setInterval(update,200);setInterval(drawVision,250);update();drawVision();
</script></body></html>
